org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project lives on a different drive (B:\) than the Gradle/Pub
# caches (C:\...) - Kotlin's incremental compiler relativizes file
# paths between them and throws "this and base files have different
# roots" the moment it tries, which crashes the daemon mid-build.
# Non-incremental compilation avoids that path-relativizing code
# entirely; it costs a slower full recompile per change, not a broken
# build.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
